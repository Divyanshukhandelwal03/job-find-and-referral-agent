<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      font-weight: 700;
      font-size: 15px;
      color: #fbbf24;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-radius: 4px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      padding: 9px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
    }
    .text-success { color: #34d399; }
    .text-error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡ Happpy Agent</span>
    <span class="badge" id="conn-badge">Local 5050</span>
  </div>

  <div class="field">
    <button type="button" id="btn-detect" style="background: #334155; margin-bottom: 10px; font-size: 11px; padding: 6px;">
      🔍 Auto-Detect From Active Tab
    </button>
  </div>

  <div class="field">
    <label>Job Title</label>
    <input type="text" id="ext-title" placeholder="e.g. Senior Backend Engineer" />
  </div>

  <div class="field">
    <label>Company</label>
    <input type="text" id="ext-company" placeholder="e.g. Razorpay" />
  </div>

  <div class="field">
    <label>Job Description Snippet</label>
    <textarea id="ext-desc" rows="4" placeholder="Job requirements or description..."></textarea>
  </div>

  <button type="button" id="btn-save">Send to Local Referral Agent</button>
  <div id="status-msg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
